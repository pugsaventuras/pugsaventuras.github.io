# Publica a pasta Site no GitHub Pages.
# Roda quando algo muda no site, a cada 30 minutos (para pegar episódio novo do YouTube sozinho)
# e quando alguém clica em "Run workflow" na aba Actions.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buscar episodios novos no YouTube
        continue-on-error: true
        run: python3 .github/scripts/episodios.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
